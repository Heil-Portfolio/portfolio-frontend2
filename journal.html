<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — PORTFOLIO.SYS</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .entry-card { border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg2); overflow:hidden; cursor:pointer; transition:border-color 0.15s; }
    .entry-card:hover { border-color:var(--border2); }
    .entry-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; gap:12px; }
    .entry-body { display:none; padding:0 20px 20px; border-top:1px solid var(--border); }
    .entry-body.open { display:block; }
    .filter-btn { font-family:var(--font-mono); font-size:11px; padding:5px 14px; border-radius:4px; border:1px solid var(--border); color:var(--muted); background:var(--bg2); cursor:pointer; transition:all 0.15s; }
    .filter-btn:hover { border-color:var(--border2); color:var(--text); }
    .filter-btn.active { border-color:var(--green); color:var(--green); background:var(--green-dim); }
  </style>
</head>
<body>
<div id="topbar"></div>
<main class="page">
  <div id="section-header"></div>

  <div style="display:flex; gap:8px; margin-bottom:20px;">
    <button class="filter-btn active" data-mode="notes" onclick="setMode(this,'notes')">Notes</button>
    <button class="filter-btn" data-mode="labs" onclick="setMode(this,'labs')">Labs</button>
  </div>

  <div id="journal-list" style="display:flex;flex-direction:column;gap:10px;">
    <div class="panel"><div class="skeleton" style="height:56px"></div></div>
    <div class="panel"><div class="skeleton" style="height:56px"></div></div>
    <div class="panel"><div class="skeleton" style="height:56px"></div></div>
  </div>
</main>
<div id="footer-wrap"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  document.getElementById('topbar').innerHTML = UI.topbar('journal');
  document.getElementById('footer-wrap').innerHTML = UI.footer();
  document.getElementById('section-header').innerHTML = UI.sectionHeader('✎','Journal','notes, bugs, discoveries & experiments');
  UI.startClock();

  let mode = 'notes';
  let openSlug = null;
  let journalData = null;
  let labsData = null;

  function tagColor(tag){
    const map={Docker:'blue',AWS:'yellow',Linux:'green',Python:'blue',Django:'green',Nginx:'purple','CI/CD':'yellow',Redis:'red',Spring:'green'};
    return map[tag]||'';
  }

  function setMode(btn, m){
    mode = m;
    openSlug = null;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
    if (m === 'labs' && labsData === null) loadLabs();
    if (m === 'notes' && journalData === null) loadJournal();
  }

  function toggle(slug){
    openSlug = openSlug===slug ? null : slug;
    render();
  }

  function renderNotes(){
    const list = document.getElementById('journal-list');
    if (journalData === null) { list.innerHTML = UI.skeleton(3); return; }
    if (!journalData.length){ list.innerHTML = UI.empty('Aucune entrée pour l\'instant'); return; }
    list.innerHTML = journalData.map(e=>{
      const isOpen = openSlug===e.slug;
      return `
        <div class="entry-card" onclick="toggle('${e.slug}')">
          <div class="entry-header">
            <div style="min-width:0;">
              <span style="font-family:var(--font-mono);color:var(--muted);font-size:10px;display:block;margin-bottom:4px;">${e.entry_date}</span>
              <span style="font-family:var(--font-sans);color:var(--text);font-size:14px;font-weight:500;">${e.title}</span>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
              ${UI.tags(e.tags.slice(0,3),'purple')}
              <span style="font-family:var(--font-mono);color:var(--muted);font-size:12px;">${isOpen?'▼':'▶'}</span>
            </div>
          </div>
          <div class="entry-body ${isOpen?'open':''}">
            <div style="font-size:13px;color:var(--text);line-height:1.8;white-space:pre-wrap;padding-top:16px;">${e.content}</div>
          </div>
        </div>`;
    }).join('');
  }

  function renderLabs(){
    const list = document.getElementById('journal-list');
    if (labsData === null) { list.innerHTML = UI.skeleton(3); return; }
    if (!labsData.length){ list.innerHTML = UI.empty('Aucun lab pour l\'instant'); return; }
    list.innerHTML = `<div class="grid-3">` + labsData.map(l=>`
      <div class="panel" style="display:flex;flex-direction:column;gap:14px;border-top:2px solid ${
        l.status==='done'?'var(--green)':l.status==='in_progress'?'var(--yellow)':'var(--border)'
      }">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="tag tag-${tagColor(l.tag)}">${l.tag}</span>
          <span style="font-family:var(--font-mono);font-size:10px;color:${
            l.status==='done'?'var(--green)':l.status==='in_progress'?'var(--yellow)':'var(--muted)'
          }">
            ${UI.statusDot(l.status)}${l.status}
          </span>
        </div>
        <span style="font-family:var(--font-sans);font-size:13px;color:var(--text);font-weight:500;">${l.name}</span>
        ${l.description?`<p style="font-size:12px;color:var(--muted2);line-height:1.5;">${l.description}</p>`:''}
        ${l.result?`
          <div style="border-top:1px solid var(--border);padding-top:10px;">
            <span class="panel-label">// result</span>
            <p style="font-size:12px;color:var(--green);">${l.result}</p>
          </div>`:''}
      </div>
    `).join('') + `</div>`;
  }

  function render(){
    if (mode === 'notes') renderNotes(); else renderLabs();
  }

  async function loadJournal(){
    try{ journalData = await API.journal.all(); render(); }
    catch(e){ if (mode==='notes') document.getElementById('journal-list').innerHTML = UI.error(); }
  }

  async function loadLabs(){
    try{ labsData = await API.labs.all(); render(); }
    catch(e){ if (mode==='labs') document.getElementById('journal-list').innerHTML = UI.error(); }
  }

  loadJournal();
</script>
</body>
</html>
