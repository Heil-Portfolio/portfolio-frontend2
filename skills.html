<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — PORTFOLIO.SYS</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div id="topbar"></div>

<main class="page">
  <div id="section-header"></div>
  <div class="grid-3" id="skills-grid">
    <div class="panel"><div class="skeleton" style="height:200px"></div></div>
    <div class="panel"><div class="skeleton" style="height:200px"></div></div>
    <div class="panel"><div class="skeleton" style="height:200px"></div></div>
  </div>
</main>

<div id="footer-wrap"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  document.getElementById('topbar').innerHTML = UI.topbar('skills');
  document.getElementById('footer-wrap').innerHTML = UI.footer();
  document.getElementById('section-header').innerHTML = UI.sectionHeader('◈', 'Skill Tree', 'proficiency map');
  UI.startClock();

  async function render() {
    try {
      const data = await API.skills.byCategory();
      const grid = document.getElementById('skills-grid');

      const panels = [
        {
          key: 'current', label: '● CURRENT STACK',
          color: '--green', barClass: 'bar-green', pctColor: '--green',
        },
        {
          key: 'learning', label: '◌ IN PROGRESS',
          color: '--blue', barClass: 'bar-blue', pctColor: '--blue',
        },
        {
          key: 'future', label: '○ FUTURE TARGETS',
          color: '--purple', barClass: 'bar-purple', pctColor: '--purple',
        },
      ];

      grid.innerHTML = panels.map(p => {
        const skills = data[p.key] || [];
        const content = skills.length
          ? skills.map(s => s.level > 0
              ? UI.progressBar(s.name, s.level, p.barClass, p.pctColor)
              : `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;">
                   <span style="color:var(${p.color});font-size:10px">◯</span>
                   <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted2)">${s.name}</span>
                   ${s.description ? `<span style="font-size:11px;color:var(--muted);margin-left:auto">${s.description.slice(0,30)}</span>` : ''}
                 </div>`
            ).join('')
          : UI.empty('Aucune compétence dans cette catégorie');

        return `
          <div class="panel">
            <h3 style="font-family:var(--font-mono);color:var(${p.color});font-size:11px;margin-bottom:20px;letter-spacing:0.1em;">
              ${p.label}
            </h3>
            ${content}
          </div>
        `;
      }).join('');

    } catch(e) {
      document.getElementById('skills-grid').innerHTML = UI.error();
    }
  }

  render();
</script>
</body>
</html>
