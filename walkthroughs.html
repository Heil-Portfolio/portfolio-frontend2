<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walkthroughs — Heil Tchamba Nana</title>
<meta name="description" content="Déploiements réels documentés dans le détail — architecture microservices, sécurité, CI/CD.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://portfolio-backend-3qxp.onrender.com/static/css/main.css" rel="stylesheet">
</head>
<body>

<div id="ui-topbar"></div>
<div id="ui-pipeline"></div>

<section class="page-head">
  <div class="terminal-line"><span class="prompt">$</span> ls walkthroughs/ --sort=date</div>
  <h1>Ce qui a <span class="accent">tenu debout</span> en production</h1>
  <p class="lede">Des déploiements réels, documentés dans le détail — pas des tutos théoriques, des vraies décisions et les bugs qui sont venus avec.</p>
</section>

<div id="list-mount"></div>

<div id="thread-mount"></div>
<div id="ui-footer"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  UI.mountChrome('walkthroughs.html', 'build');
  document.getElementById('thread-mount').outerHTML = UI.thread([
    UI.threadCard('suite logique', 'Le brut derrière ces articles', 'Notes prises pendant l\'apprentissage, avant qu\'elles deviennent des walkthroughs', 'notes.html', 'forward'),
    UI.threadCard('retour', 'Qui a écrit tout ça', 'Accueil', 'index.html', 'back'),
  ]);

  const mount = document.getElementById('list-mount');
  mount.innerHTML = UI.skeleton(3);

  Promise.all([API.walkthroughs.all(), API.curriculum.order()])
    .then(([items, curriculum]) => {
      const published = (items || []).filter(w => w.status === 'published');
      if (!published.length) { mount.innerHTML = UI.empty('Aucun walkthrough publié pour l\'instant — revenez bientôt.'); return; }
      const groups = UI.groupBySections(published, curriculum);
      mount.innerHTML = UI.sectionsHtml(groups, UI.walkthroughCard);
    })
    .catch(() => { mount.innerHTML = UI.error(); });
</script>
</body>
</html>
